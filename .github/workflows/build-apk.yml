name: Build FootPulse APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FootPulse-NoAds-v2.18.0-ICE-SOURCE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - - name: Set up Android SDK
  uses: android-actions/setup-android@v3
  with:
    packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-34' 'build-tools;35.0.0'

      - name: Extract FootPulse source
        run: |
          test -f FootPulse-NoAds-v2.18.0-ICE-SOURCE.zip
          mkdir -p extracted
          unzip -q FootPulse-NoAds-v2.18.0-ICE-SOURCE.zip -d extracted
          test -f extracted/FootPulse-NoAds-Source-v2/settings.gradle
          test -f extracted/FootPulse-NoAds-Source-v2/app/build.gradle

      - name: Build Debug APK
        working-directory: extracted/FootPulse-NoAds-Source-v2
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and name APK
        run: |
          test -f extracted/FootPulse-NoAds-Source-v2/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp extracted/FootPulse-NoAds-Source-v2/app/build/outputs/apk/debug/app-debug.apk dist/FootPulse-v2.18.0-debug.apk
          sha256sum dist/FootPulse-v2.18.0-debug.apk > dist/SHA256SUMS.txt

      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: FootPulse-v2.18.0-Debug-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
